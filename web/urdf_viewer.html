<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G2 机器人 URDF 查看器</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #viewer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; }
        #panel {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: rgba(33,37,41,0.85); color: #fff;
            padding: 12px 16px; border-radius: 8px; font-size: 14px;
            min-width: 240px; max-height: 90vh; overflow-y: auto;
        }
        #panel h5 { margin-bottom: 8px; }
        #panel select { background: #2c313a; color: #fff; border: 1px solid #495057; }
        #status { color: #ffc107; margin-top: 6px; font-size: 13px; }
        .joint-row { margin: 4px 0; }
        .joint-row label { display: inline-block; width: 140px; font-size: 12px; }
        .joint-row input[type=range] { width: 120px; vertical-align: middle; }
        .joint-row .val { display: inline-block; width: 50px; text-align: right; font-size: 12px; color: #0f0; }
        #togglePanel {
            position: absolute; top: 10px; right: 10px; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>

    <div id="panel">
        <h5>G2 URDF 查看器</h5>
        <div>
            <label>URDF 文件:</label>
            <select id="urdfSelect" class="form-select form-select-sm">
                <option value="urdf/G2_t2_crsB/G2_t2_crsB.urdf" selected>G2_t2_crsB (默认)</option>
                <option value="urdf/G2_t2_crsB/G2_t2_crsB_o10_t2.urdf">G2_t2_crsB_o10_t2</option>
                <option value="urdf/G2_t2_crsB/G2_t2_crsB_o12_t2.urdf">G2_t2_crsB_o12_t2</option>
                <option value="urdf/G2_t2_crsB/G2_t2_crsB_omnipicker.urdf">G2_t2_crsB_omnipicker</option>
                <option value="urdf/G2_t2_crsB/G2_t2_crsB_ctek90d.urdf">G2_t2_crsB_ctek90d</option>
                <option value="urdf/G2_t2_crsB/G2_t2_crsB_dahuan_huatian.urdf">G2_t2_crsB_dahuan_huatian</option>
                <option value="urdf/G2_t2_crsB/G2_t2_crsB_dahuan_jd.urdf">G2_t2_crsB_dahuan_jd</option>
                <option value="urdf/G2_t2_crs/G2_t2_crs.urdf">G2_t2_crs</option>
                <option value="urdf/G2_t2v2_crsB/G2_t2v2_crsB.urdf">G2_t2v2_crsB</option>
                <option value="urdf/G2_t2v2_crs/G2_t2v2_crs.urdf">G2_t2v2_crs</option>
                <option value="urdf/G1/G1.urdf">G1</option>
                <option value="urdf/G2H_t0_acs/G2H_t0_acs.urdf">G2H_t0_acs</option>
                <option value="urdf/G2L_lg_crs/G2L_lg_crs.urdf">G2L_lg_crs</option>
                <option value="urdf/G2S_t0_crsP/G2S_t0_crsP.urdf">G2S_t0_crsP</option>
            </select>
        </div>
        <div id="status">加载中...</div>
        <hr style="border-color:#495057">
        <div id="joints"></div>
    </div>

    <button id="togglePanel" class="btn btn-sm btn-light">显示/隐藏面板</button>

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.4/src/urdf-loader.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
        import { URDFLoader } from 'urdf-loader';

        // ── 场景初始化 ──────────────────────────────────
        const container = document.getElementById('viewer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(2.5, 1.5, 2.5);
        camera.lookAt(0, 0.8, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // ── 灯光 ────────────────────────────────────────
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.4);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);

        // ── 网格地面 ────────────────────────────────────
        const grid = new THREE.GridHelper(10, 20, 0x444444, 0x222222);
        scene.add(grid);

        // ── 控制器 ──────────────────────────────────────
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.8, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;

        // ── URDF 加载器 ────────────────────────────────
        const stlLoader = new STLLoader();
        const colladaLoader = new ColladaLoader();

        function rewriteMeshPath(path) {
            // package://genie_robot_description/meshes/...  →  urdf/meshes/...
            return path.replace(/^package:\/\/genie_robot_description\//, 'urdf/');
        }

        const urdfLoader = new URDFLoader();
        urdfLoader.loadMeshCb = (path, manager, done) => {
            const url = rewriteMeshPath(path);
            const ext = url.split('.').pop().toLowerCase();
            if (ext === 'stl') {
                stlLoader.load(url, (geom) => {
                    const mat = new THREE.MeshPhongMaterial({
                        color: 0xb0b0b0, specular: 0x222222, shininess: 30
                    });
                    const mesh = new THREE.Mesh(geom, mat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    done(mesh);
                }, undefined, (err) => {
                    console.warn('STL 加载失败:', url, err);
                    done(new THREE.Mesh());
                });
            } else if (ext === 'dae') {
                colladaLoader.load(url, (collada) => {
                    done(collada.scene);
                }, undefined, (err) => {
                    console.warn('DAE 加载失败:', url, err);
                    done(new THREE.Mesh());
                });
            } else {
                console.warn('未知 mesh 类型:', url);
                done(new THREE.Mesh());
            }
        };

        let currentRobot = null;
        const statusEl = document.getElementById('status');
        const jointsEl = document.getElementById('joints');

        function loadURDF(url) {
            statusEl.textContent = '加载中: ' + url;
            if (currentRobot) {
                scene.remove(currentRobot);
                currentRobot = null;
            }
            jointsEl.innerHTML = '';

            urdfLoader.load(url, (robot) => {
                currentRobot = robot;
                // 居中：将底盘放到地面
                robot.traverse(c => {
                    if (c.isMesh) {
                        c.castShadow = true;
                        c.receiveShadow = true;
                    }
                });
                scene.add(robot);

                // 自动调整相机
                const box = new THREE.Box3().setFromObject(robot);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const dist = maxDim * 2.0;
                camera.position.set(dist, dist * 0.6, dist);
                controls.target.copy(center);
                controls.update();

                statusEl.textContent = '✅ 已加载: ' + url + ' (' + countLinks(robot) + ' links)';

                // 创建关节滑块
                buildJointUI(robot);
            }, (progress) => {
                if (progress && progress.total) {
                    const pct = Math.round(progress.loaded / progress.total * 100);
                    statusEl.textContent = '加载中... ' + pct + '%';
                }
            }, (err) => {
                statusEl.textContent = '❌ 加载失败: ' + err;
                console.error(err);
            });
        }

        function countLinks(robot) {
            let n = 0;
            robot.traverse(c => { if (c.isURDFLink) n++; });
            return n;
        }

        function buildJointUI(robot) {
            const joints = [];
            robot.traverse(c => {
                if (c.isURDFJoint && c.jointType !== 'fixed') {
                    joints.push(c);
                }
            });
            if (joints.length === 0) {
                jointsEl.innerHTML = '<small>无可动关节</small>';
                return;
            }
            jointsEl.innerHTML = '<small>关节控制 (' + joints.length + ')</small>';
            joints.forEach((j) => {
                const row = document.createElement('div');
                row.className = 'joint-row';
                const lbl = document.createElement('label');
                lbl.textContent = j.name.length > 22 ? j.name.slice(0, 20) + '..' : j.name;
                lbl.title = j.name;
                const range = document.createElement('input');
                range.type = 'range';
                const lo = j.limit.lower ?? -3.14;
                const hi = j.limit.upper ?? 3.14;
                range.min = lo;
                range.max = hi;
                range.step = 0.01;
                range.value = j.angle || 0;
                const valEl = document.createElement('span');
                valEl.className = 'val';
                valEl.textContent = parseFloat(range.value).toFixed(2);
                range.addEventListener('input', () => {
                    const v = parseFloat(range.value);
                    j.setJointValue(v);
                    valEl.textContent = v.toFixed(2);
                });
                row.appendChild(lbl);
                row.appendChild(range);
                row.appendChild(valEl);
                jointsEl.appendChild(row);
            });
        }

        // ── 事件 ────────────────────────────────────────
        document.getElementById('urdfSelect').addEventListener('change', (e) => {
            loadURDF(e.target.value);
        });
        document.getElementById('togglePanel').addEventListener('click', () => {
            const p = document.getElementById('panel');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ── 默认加载 ────────────────────────────────────
        loadURDF('urdf/G2_t2_crsB/G2_t2_crsB.urdf');

        // ── 渲染循环 ────────────────────────────────────
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
